name: reflective-planning-agent
base: core24
version: '0.1.0'
summary: Planning agent that critiques its own plans and asks before acting
description: |
  Proposes calendar changes, checks them with deterministic rules and an LLM
  judge, revises, and asks a human before moving or removing anything.
  Runs in mock mode ($0) by default. For live mode, put a .env file in
  ~/snap/reflective-planning-agent/current/ (see README).
grade: devel
confinement: strict

apps:
  reflective-planning-agent:
    command: bin/rpa
    plugs: [network, home]
  chat:
    command: bin/rpa-chat
    plugs: [network, home]

parts:
  agent:
    plugin: python
    source: .
